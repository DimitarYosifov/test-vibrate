<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test vibrate</title>
</head>

<body>
    <div style="  
    align-items: center;
    flex-wrap: wrap;
    display: flex;  
    justify-content: center;
    flex-direction: column;
    width: 100%;">
        <div onclick="start()" style="padding: 25px;">start6</div>
        <div onclick="stop()" style="padding: 25px;">stop</div>
        <div id="count">1</div>
    </div>

    <script>
        let counter = 1;
        const start = () => {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate([5000]);
            }
        }

        const stop = () => {
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate([]);
                counter++;
                document.getElementById('count').innerHTML = counter
            }
        }

    </script>
</body>

</html>
